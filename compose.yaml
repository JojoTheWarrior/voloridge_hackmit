services:
  api:
    build: .
    environment:
      KINGDOM_FAKE_DEVIN: "0"
      KINGDOM_MAX_ACU: "0"
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"
    ports:
      - "127.0.0.1:8030:8030"
    volumes:
      - .:/app:ro
      - ./.kingdom:/state
  web:
    image: node:22-bookworm-slim
    working_dir: /app/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      KINGDOM_API_TARGET: http://api:8030
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - web-deps:/app/web/node_modules
    depends_on:
      - api
volumes:
  demo-state:
  web-deps:
