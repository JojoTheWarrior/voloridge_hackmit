<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kingdom — refined castle</title>
  <style>
    @font-face{font-family:Geist;src:url(assets/fonts/geist.woff2) format('woff2');font-weight:100 900}
    *{box-sizing:border-box}body{margin:0;background:#f1f0ed;color:#111;font-family:Geist,system-ui,sans-serif}
    main{max-width:1280px;margin:auto;padding:36px 40px 30px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    header h1{font-size:20px;font-weight:500;letter-spacing:-.6px;margin:0}
    header span{font-size:12px;color:#777;letter-spacing:.04em}
    .panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .panel{height:384px;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .panel.dark{background:#101010;color:#f5f5f2}
    .hero{width:142px;height:142px}
    .dark img{filter:invert(1)}
    .wordmark{font-size:54px;line-height:1;font-weight:500;letter-spacing:-2.7px;margin:0}
    .details{margin-top:20px;background:#fff;border-radius:18px;padding:24px 30px;display:grid;grid-template-columns:130px 180px 1fr 175px;gap:26px;align-items:start;height:171px}
    .label{font-size:11px;letter-spacing:.09em;color:#888;margin:0 0 19px;font-weight:400;text-transform:uppercase}
    .comparison{width:62px;height:62px}.sizes{display:flex;align-items:center;gap:26px;height:62px}
    .lockup{height:62px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;letter-spacing:-.4px}
    footer{display:flex;justify-content:space-between;margin-top:18px;color:#888;font-size:12px}
    footer strong{color:#444;font-weight:400}
  </style>
</head>
<body>
  <main>
    <header><h1>kingdom / refined castle</h1><span>The same mark, with a softer finish.</span></header>
    <section class="panels" aria-label="Refined logo on light and dark backgrounds">
      <div class="panel"><img class="hero" src="assets/castle.svg" alt="Refined castle"><p class="wordmark">kingdom</p></div>
      <div class="panel dark"><img class="hero" src="assets/castle.svg" alt="Refined white castle"><p class="wordmark">kingdom</p></div>
    </section>
    <section class="details" aria-label="Before and after, sizes and header lockup">
      <div><p class="label">Before</p><svg class="comparison" viewBox="0 0 16 16" fill="currentColor" aria-label="Original castle"><path d="M1 2h3v2h2V2h4v2h2V2h3v13h-5v-4a2 2 0 0 0-4 0v4H1z"/></svg></div>
      <div><p class="label">Refined</p><img class="comparison" src="assets/castle.svg" alt="Refined castle comparison"></div>
      <div><p class="label">At every size</p><div class="sizes"><img src="assets/castle.svg" width="16" height="16" alt="16 pixels"><img src="assets/castle.svg" width="24" height="24" alt="24 pixels"><img src="assets/castle.svg" width="32" height="32" alt="32 pixels"><img src="assets/castle.svg" width="48" height="48" alt="48 pixels"></div></div>
      <div><p class="label">In the header</p><div class="lockup"><img src="assets/castle.svg" width="16" height="16" alt="Castle">kingdom</div></div>
    </section>
    <footer><strong>Even battlements. Rounded corners. A clean arch.</strong><span>Vector artwork · monochrome</span></footer>
  </main>
</body>
</html>
